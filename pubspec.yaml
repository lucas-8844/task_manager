name: task_manager
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Ícones padrão estilo iOS
  cupertino_icons: ^1.0.8

  # Banco de dados SQLite
  sqflite: ^2.3.0

  # Para encontrar diretórios do sistema
  path_provider: ^2.1.1

  # Utilidades para manipular caminhos
  path: ^1.8.3

  # IDs únicos para cada tarefa
  uuid: ^4.2.1

  # Formatação de datas
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3

  camera: ^0.10.5+9              # Câmera
  permission_handler: ^11.3.1    # Gerenciamento de permissões
  sensors_plus: ^4.0.2           # Sensores (acelerômetro)
  vibration: ^1.8.4              # Feedback tátil
  geolocator: ^10.1.0            # GPS
  geocoding: ^2.1.1              # Endereços
  google_maps_flutter: ^2.6.0
